<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- ── Main screen (Pull + Pair tabs) ───────────────────── -->
  <div id="screen-main" class="screen active">
    <header class="app-header">
      <nav class="tabs">
        <button class="tab-item active" data-tab="pull">Pull</button>
        <button class="tab-item" data-tab="pair">Pair</button>
      </nav>
    </header>

    <!-- Pull tab -->
    <div id="tab-pull" class="tab-content active">
      <div class="actions">
        <button id="btn-push" class="btn btn-primary">Upload</button>
        <div class="divider">or pull from another machine</div>
        <div class="pull-col">
          <input
            id="pull-input"
            type="text"
            placeholder="ZEN-XXXX-XXXX"
            maxlength="28"
            spellcheck="false"
            autocomplete="off"
            aria-label="Sync code"
          />
          <button id="btn-pull" class="btn btn-secondary">Pull</button>
        </div>
      </div>
      <div id="status-main" class="msg-box hidden" role="status"></div>
    </div>

    <!-- Pair tab -->
    <div id="tab-pair" class="tab-content">
      <div id="pair-msg" class="msg-box msg-neutral" role="status" aria-live="polite">Enter the same passphrase on each machine to enable automatic sync.</div>

      <div class="field">
        <label class="field-label" for="passphrase-input">PASSPHRASE</label>
        <div class="passphrase-wrap">
          <input type="text" id="passphrase-input" placeholder="e.g. purple-fox-mountain-7" autocomplete="off" spellcheck="false" />
          <button id="btn-generate" type="button" class="btn btn-secondary" title="Generate passphrase">
            <!-- Phosphor ArrowCounterClockwise -->
            <svg width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
              <path d="M224,128a96,96,0,0,1-94.71,96H128A95.38,95.38,0,0,1,62.1,197.8a8,8,0,0,1,11-11.63A80,80,0,1,0,71.43,71.39a3.07,3.07,0,0,1-.26.25L44.59,96H72a8,8,0,0,1,0,16H24a8,8,0,0,1-8-8V56a8,8,0,0,1,16,0V85.8L60.25,60A96,96,0,0,1,224,128Z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="toggles">
        <label class="toggle-label">
          <input type="checkbox" id="toggle-auto-push" checked />
          Auto-push when Zen closes
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="toggle-auto-pull" checked />
          Auto-pull when another machine syncs
        </label>
      </div>

      <div class="pair-actions">
        <button id="btn-save-passphrase" class="btn btn-primary">Save &amp; Pair</button>
        <button id="btn-forget-passphrase" class="btn btn-secondary">Forget</button>
      </div>
    </div>
  </div>

  <!-- ── Push result screen ────────────────────────────────── -->
  <div id="screen-push" class="screen">
    <div class="push-header">
      <p class="result-title">Sync Code</p>
      <div class="divider">Share this with your other machine(s)</div>
    </div>

    <div class="push-body">
      <div id="sync-code" class="code-display" title="Click to copy">ZEN-0000</div>
      <div class="push-actions">
        <button id="btn-copy" class="btn btn-primary">Copy</button>
        <button id="btn-push-done" class="btn btn-ghost">Done</button>
      </div>
    </div>

    <p id="countdown" class="countdown">Expires in <strong id="countdown-time">60:00</strong></p>
  </div>

  <!-- ── Pull result screen ────────────────────────────────── -->
  <div id="screen-pull" class="screen">
    <div class="pull-result-body">
      <!-- Phosphor Check -->
      <svg class="check-icon" width="48" height="48" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
        <path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/>
      </svg>
      <p class="result-title">Pull successful!</p>
      <div class="msg-box msg-success">Open Zen Browser to see your changes.</div>
      <p id="pull-files" class="pull-files"></p>
    </div>
    <button id="btn-pull-done" class="btn btn-ghost">Done</button>
  </div>

  <!-- ── Update dialog overlay ─────────────────────────────── -->
  <div id="update-dialog" class="update-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="update-title">
    <div class="update-card">
      <p class="update-version" id="update-title">Zync <span id="update-version-number"></span> is available</p>
      <p class="update-current">You have <span id="update-current-version"></span></p>
      <div class="update-notes-wrap">
        <div id="update-notes" class="update-notes"></div>
      </div>
      <div class="update-actions">
        <button id="btn-update-later" class="btn btn-ghost">Later</button>
        <button id="btn-update-install" class="btn btn-primary">Install &amp; Restart</button>
      </div>
      <p id="update-error" class="update-error hidden"></p>
    </div>
  </div>

</div>
<script src="main.js"></script>
</body>
</html>
