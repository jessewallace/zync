<svg xmlns="http://www.w3.org/2000/svg" width="420" height="460" viewBox="0 0 420 460">
  <defs>
    <style>
      text { font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Window background -->
  <rect width="420" height="460" rx="12" fill="#f2f0e3"/>

  <!-- Header area (slightly darker surface) -->
  <rect x="0" y="0" width="420" height="66" rx="12" fill="rgba(0,0,0,0.05)"/>
  <!-- Fix bottom corners of header to be square -->
  <rect x="0" y="46" width="420" height="20" fill="rgba(0,0,0,0.05)"/>

  <!-- Tab: Pull (active — same as bg color) -->
  <rect x="88" y="16" width="108" height="50" rx="10" fill="#f2f0e3"/>
  <text x="142" y="50" text-anchor="middle" font-size="24" font-weight="600" fill="#1a1914">Pull</text>

  <!-- Tab: Pair (inactive) -->
  <text x="262" y="50" text-anchor="middle" font-size="24" font-weight="600" fill="#9b9781">Pair</text>

  <!-- Tab content area — padding 24px 32px -->
  <!-- Upload button (btn-primary, accent color) -->
  <rect x="32" y="90" width="356" height="62" rx="10" fill="#f76f53"/>
  <text x="210" y="129" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff" letter-spacing="0.04em">Upload</text>

  <!-- Divider: "or pull from another machine" -->
  <!-- Left line -->
  <line x1="32" y1="170" x2="100" y2="170" stroke="#d4d2ca" stroke-width="1"/>
  <!-- Text -->
  <text x="210" y="174" text-anchor="middle" font-size="12" font-weight="400" fill="#1a1914" letter-spacing="0.08em">or pull from another machine</text>
  <!-- Right line -->
  <line x1="320" y1="170" x2="388" y2="170" stroke="#d4d2ca" stroke-width="1"/>

  <!-- Pull input box -->
  <rect x="32" y="188" width="356" height="62" rx="10" fill="none" stroke="#9b9781" stroke-width="2"/>
  <text x="210" y="227" text-anchor="middle" font-size="24" font-weight="500" fill="#9b9781" letter-spacing="0.02em">ZEN-XXXX-XXXX</text>

  <!-- Pull button (btn-secondary, dark color) -->
  <rect x="32" y="258" width="356" height="62" rx="10" fill="#28262f"/>
  <text x="210" y="297" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff" letter-spacing="0.04em">Pull</text>
</svg>
