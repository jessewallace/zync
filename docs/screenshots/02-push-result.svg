<svg xmlns="http://www.w3.org/2000/svg" width="420" height="460" viewBox="0 0 420 460">
  <defs>
    <style>
      text { font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Window background -->
  <rect width="420" height="460" rx="12" fill="#f2f0e3"/>

  <!-- Push result screen — centered content, padding 40px 32px, gap 24px -->

  <!-- push-header block -->
  <!-- "Sync Code" title -->
  <text x="210" y="88" text-anchor="middle" font-size="32" font-weight="600" fill="#1a1914">Sync Code</text>

  <!-- Divider: "Share this with your other machine(s)" -->
  <line x1="32" y1="107" x2="88" y2="107" stroke="#d4d2ca" stroke-width="1"/>
  <text x="210" y="111" text-anchor="middle" font-size="12" font-weight="400" fill="#1a1914" letter-spacing="0.06em">Share this with your other machine(s)</text>
  <line x1="332" y1="107" x2="388" y2="107" stroke="#d4d2ca" stroke-width="1"/>

  <!-- push-body block (gap 24px below push-header) -->

  <!-- Sync code display box — strong border stroke="#1a1914", monospace-style -->
  <rect x="32" y="131" width="356" height="62" rx="10" fill="none" stroke="#1a1914" stroke-width="2"/>
  <text x="210" y="170" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1914" letter-spacing="0.06em">ZEN-A3F9B2-K8MN4X</text>

  <!-- push-actions (gap 16px below code box) -->
  <!-- Copy button (btn-primary, accent) -->
  <rect x="32" y="209" width="172" height="62" rx="10" fill="#f76f53"/>
  <text x="118" y="248" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff" letter-spacing="0.04em">Copy</text>

  <!-- Done button (btn-ghost, surface) -->
  <rect x="216" y="209" width="172" height="62" rx="10" fill="rgba(0,0,0,0.05)"/>
  <text x="302" y="248" text-anchor="middle" font-size="24" font-weight="600" fill="#1a1914" letter-spacing="0.04em">Done</text>

  <!-- Countdown (gap 24px below push-body) -->
  <text x="210" y="315" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1914">Expires in <tspan font-weight="800">59:42</tspan></text>
</svg>
